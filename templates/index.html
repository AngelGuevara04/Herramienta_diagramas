<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroDiagrams - Editor Visual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --radius: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            padding: 1.5rem 0;
            text-align: center;
            background: linear-gradient(135deg, rgba(30,41,59,0) 0%, rgba(30,41,59,0.8) 100%);
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-content {
            display: flex;
            flex: 1;
            padding: 1rem;
            gap: 1rem;
            height: calc(100vh - 100px);
        }

        .setup-panel {
            width: 100%;
            max-width: 800px;
            margin: 2rem auto;
            background: var(--surface-color);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .editor-container {
            display: none;
            width: 100%;
            height: 100%;
            gap: 1rem;
        }

        .drawio-wrapper {
            flex: 1;
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .sidebar {
            width: 350px;
            background: var(--surface-color);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            background: rgba(15, 23, 42, 0.5);
        }

        .concept-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .concept-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            padding: 0.8rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .concept-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        select, textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: monospace;
            box-sizing: border-box;
        }

        textarea {
            min-height: 200px;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

    </style>
</head>
<body>

    <header>
        <h1>NeuroDiagrams Editor</h1>
    </header>

    <div class="main-content">
        <!-- Panel de Configuración Inicial -->
        <div class="setup-panel" id="setup-panel">
            <h2 style="margin-top:0; color:var(--primary-color);">Crea tu Estructura</h2>
            <p style="color:var(--text-muted); margin-bottom:2rem;">Ingresa el código JSON o estructura manual para generar el lienzo interactivo.</p>
            
            <form id="manual-form">
                <div class="form-group">
                    <label>Tipo de Diagrama</label>
                    <select id="manual-tipo" required>
                        <option value="mapa_mental">Mapa Mental (Diccionario Python/JSON)</option>
                        <option value="mapa_conceptual">Mapa Conceptual (Formato con flechas --&gt;)</option>
                        <option value="cuadro_sinoptico">Cuadro Sinóptico (Diccionario Python/JSON)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Estructura / Código:</label>
                    <textarea id="manual-contenido" required placeholder='{"Tema": {"Subtema 1": "Valor", "Subtema 2": "Valor"}}'></textarea>
                </div>
                
                <button type="submit" class="btn" style="width: 100%">Generar Editor Visual</button>
            </form>
        </div>

        <!-- Editor Visual y Asistente -->
        <div class="editor-container" id="editor-container">
            <div class="drawio-wrapper">
                <iframe id="drawio-frame" src="https://embed.diagrams.net/?embed=1&ui=min&spin=1&modify=1&saveAndExit=0&drafts=0" frameborder="0" style="width:100%; height:100%;"></iframe>
            </div>
            
            <div class="sidebar">
                <div class="sidebar-header">
                    <i class="fas fa-magic"></i> Asistente de Imágenes
                </div>
                <div class="concept-list" id="concept-list">
                    <!-- Conceptos inyectados por JS -->
                </div>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-color); margin-bottom: 1rem;"></i>
        <h3 id="loading-text">Procesando...</h3>
    </div>

    <script>
        let currentXml = "";
        let pendingImageConcept = null;
        let pendingImageUrl = null;

        // Escuchar mensajes del iframe de draw.io
        window.addEventListener('message', function(evt) {
            if (evt.data && typeof evt.data === 'string') {
                try {
                    const msg = JSON.parse(evt.data);
                    
                    if (msg.event === 'init') {
                        // El iframe esta listo, cargamos el XML inicial
                        if(currentXml) loadXmlToDrawio(currentXml);
                    }
                    else if (msg.event === 'export') {
                        // Recibimos el XML exportado del editor
                        currentXml = msg.data;
                        if (pendingImageConcept && pendingImageUrl) {
                            injectImageToXmlAndReload();
                        }
                    }
                } catch(e) {}
            }
        });

        function loadXmlToDrawio(xml) {
            const iframe = document.getElementById('drawio-frame');
            
            // Extracción quirúrgica: garantizamos que inicie EXACTAMENTE en <mxfile
            let cleanXml = xml;
            if (typeof cleanXml !== 'string') {
                alert("CRÍTICO: cleanXml no es un string! Es tipo: " + typeof cleanXml);
                return;
            }
            
            const match = cleanXml.match(/<mxfile[\s\S]*/);
            if (match) {
                cleanXml = match[0];
            } else {
                alert("CRÍTICO: El XML no contiene <mxfile. Primeros 50 chars: " + cleanXml.substring(0, 50));
            }
            
            alert("A PUNTO DE ENVIAR A DRAWIO. Primeros caracteres: \n" + cleanXml.substring(0, 50));
            console.log("Enviando a Draw.io:", cleanXml);
            
            iframe.contentWindow.postMessage(JSON.stringify({
                action: 'load',
                autosave: 1,
                xml: cleanXml
            }), '*');
        }

        function requestExportFromDrawio() {
            const iframe = document.getElementById('drawio-frame');
            iframe.contentWindow.postMessage(JSON.stringify({
                action: 'export',
                format: 'xml'
            }), '*');
        }

        // 1. Generar Estructura (Backend)
        document.getElementById('manual-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tipo = document.getElementById('manual-tipo').value;
            const json_str = document.getElementById('manual-contenido').value;

            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('loading-text').innerText = 'Generando estructura base...';

            try {
                const response = await fetch('/generar_manual', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo, json_str })
                });

                if (!response.ok) {
                    const errorJson = await response.json();
                    throw new Error(errorJson.error || "Error en el servidor");
                }

                const data = await response.json();
                currentXml = data.xml;

                // Extraer conceptos del XML usando Regex simple para el panel
                let conceptos = [];
                const regex = /value="([^"]+)"/g;
                let match;
                while ((match = regex.exec(currentXml)) !== null) {
                    let val = match[1];
                    // Filtrar html u objetos estructurales
                    if (val.length > 2 && !val.includes('&lt;')) {
                        conceptos.push(val);
                    }
                }
                // Remover duplicados
                conceptos = [...new Set(conceptos)];

                // Cambiar UI
                document.getElementById('setup-panel').style.display = 'none';
                document.getElementById('editor-container').style.display = 'flex';
                
                // Cargar panel
                const list = document.getElementById('concept-list');
                list.innerHTML = '';
                conceptos.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'concept-item';
                    div.innerHTML = `
                        <div class="concept-name" title="${c}">${c}</div>
                        <button class="btn btn-small" onclick="buscarImagenPara('${c.replace(/'/g, "\\'")}', this)">
                            <i class="fas fa-image"></i> Buscar
                        </button>
                    `;
                    list.appendChild(div);
                });

                // Cargar XML (esperar a que el init haya pasado o forzar)
                setTimeout(() => loadXmlToDrawio(currentXml), 1000);

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        });

        // 2. Buscar Imagen Uno a Uno
        window.buscarImagenPara = async function(concepto, btnElement) {
            const originalHtml = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btnElement.disabled = true;

            try {
                const response = await fetch('/buscar_imagen', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ concepto })
                });

                const data = await response.json();
                if (data.image_url) {
                    pendingImageConcept = concepto;
                    pendingImageUrl = data.image_url;
                    
                    // Botón éxito
                    btnElement.classList.add('btn-success');
                    btnElement.innerHTML = '<i class="fas fa-check"></i> Lista';

                    // Pedir XML a drawio
                    requestExportFromDrawio();
                } else {
                    btnElement.innerHTML = '<i class="fas fa-times"></i> Sin foto';
                }
            } catch (err) {
                alert("Error: " + err.message);
                btnElement.innerHTML = originalHtml;
                btnElement.disabled = false;
            }
        };

        // 3. Inyectar imagen al XML recibido de Drawio y recargar
        function injectImageToXmlAndReload() {
            // El XML viene como string. Vamos a hacer un replace crudo pero seguro
            // Buscamos el mxCell que tenga value="concepto"
            
            // Reemplazar de forma segura en XML
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(currentXml, "text/xml");
            
            const cells = xmlDoc.getElementsByTagName('mxCell');
            for (let i = 0; i < cells.length; i++) {
                if (cells[i].getAttribute('value') === pendingImageConcept) {
                    let style = cells[i].getAttribute('style') || "";
                    
                    if (!style.includes('shape=image')) {
                        // Remover shape viejo si existe
                        let newStyleParts = [];
                        style.split(';').forEach(p => {
                            if(p && !p.startsWith('shape=')) newStyleParts.push(p);
                        });
                        
                        let newStyle = `shape=image;image=${pendingImageUrl};verticalLabelPosition=bottom;verticalAlign=top;` + newStyleParts.join(';');
                        if(!newStyle.endsWith(';')) newStyle += ';';
                        
                        cells[i].setAttribute('style', newStyle);
                        
                        // Opcional: Hacer la caja más grande si queremos que la foto se vea mejor
                        const geom = cells[i].getElementsByTagName('mxGeometry')[0];
                        if (geom) {
                            geom.setAttribute('width', '80');
                            geom.setAttribute('height', '80');
                        }
                    }
                }
            }

            const serializer = new XMLSerializer();
            currentXml = serializer.serializeToString(xmlDoc);
            
            // Recargar editor
            loadXmlToDrawio(currentXml);
            
            // Limpiar
            pendingImageConcept = null;
            pendingImageUrl = null;
        }

    </script>
</body>
</html>
